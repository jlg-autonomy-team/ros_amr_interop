mqtt_bridge:
  ros__parameters:
    mqtt_address: "localhost"
    mqtt_port: 1883
    mqtt_username: ""
    mqtt_password: ""
    manufacturer_name: "robots"
    serial_number: "robot_1"
    # "cartesian" (default): x/y [m], theta [rad] in the robot map frame.
    # "wgs84": x=longitude, y=latitude [deg], theta=compass heading [rad] (0=North, CW).
    #   Requires robot_localization navsat_transform (fromLLArray/toLL services).
    coordinate_system: "cartesian"
    geo_map_id: "" # wgs84 only: overrides agvPosition.mapId when not empty
    geo_service_timeout: 1.0 # [s]

controller:
  ros__parameters:
    robot_name: "robot_1"
    manufacturer_name: "robots"
    serial_number: "robot_1"

adapter:
  ros__parameters:
    robot_name: "robot_1"
    manufacturer_name: "robots"
    serial_number: "robot_1"
